server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA 라우팅 (새로고침 시 404 방지)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 요청은 백엔드 컨테이너로 프록시
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
