server {
    listen 80;
    server_name foryou-dev.abcganada.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name foryou-dev.abcganada.xyz;

    ssl_certificate /etc/letsencrypt/live/foryou-dev.abcganada.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foryou-dev.abcganada.xyz/privkey.pem;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
