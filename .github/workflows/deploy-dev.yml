name: Deploy Dev

on:
  push:
    branches:
      - dev

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create backend config files
        env:
          BACKEND_APPLICATION_DEV_YAML: ${{ secrets.BACKEND_APPLICATION_DEV_YAML }}
          BACKEND_APPLICATION_JWT_YAML: ${{ secrets.BACKEND_APPLICATION_JWT_YAML }}
          BACKEND_APPLICATION_OAUTH2_YAML: ${{ secrets.BACKEND_APPLICATION_OAUTH2_YAML }}
        run: |
          test -n "$BACKEND_APPLICATION_DEV_YAML"
          test -n "$BACKEND_APPLICATION_JWT_YAML"
          test -n "$BACKEND_APPLICATION_OAUTH2_YAML"
          printf '%s' "$BACKEND_APPLICATION_DEV_YAML" > backend/src/main/resources/application-dev.yaml
          printf '%s' "$BACKEND_APPLICATION_JWT_YAML" > backend/src/main/resources/application-jwt.yaml
          printf '%s' "$BACKEND_APPLICATION_OAUTH2_YAML" > backend/src/main/resources/application-oauth2.yaml

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/burrito-foryou/foryou-backend:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create frontend env file
        env:
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |
          test -n "$FRONTEND_ENV"
          printf '%s' "$FRONTEND_ENV" > frontend/.env

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/burrito-foryou/foryou-frontend:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Dev Server
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy config files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.dev.yml,nginx/nginx.dev.conf
          target: /opt/foryou

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/foryou
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u burrito-foryou --password-stdin
            docker compose -f docker-compose.dev.yml pull
            docker compose -f docker-compose.dev.yml up -d
            docker image prune -f
