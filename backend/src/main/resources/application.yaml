spring:
  application:
    name: foryou

  devtools:
    add-properties: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

logging:
  level:
    root: INFO
    xyz.abcganada.foryou.auth: DEBUG
    xyz.abcganada.foryou.member: DEBUG

image:
  upload:
    path: /tmp/foryou/images
    url-prefix: http://localhost:8080/images

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: local

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

